<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./../../libs/cesium/Cesium1.98/Widgets/widgets.css">
    <script type="text/javascript" src="./../../libs/cesium/Cesium1.98/Cesium.js"></script>
    <script src="./env.js"></script>
    <script src="./CesiumNavigation.umd.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">

        Cesium.Ion.defaultAccessToken = defaultAccessToken
        const viewer = new Cesium.Viewer('map', {});
        
        // 开启帧率
        viewer.scene.debugShowFramesPerSecond = true;

        // 清除默认地形
        viewer.scene.terrainProvider = new Cesium.EllipsoidTerrainProvider({});

        // 加载火星地形
        // viewer.scene.terrainProvider = new Cesium.CesiumTerrainProvider({
        // viewer.terrainProvider = new Cesium.CesiumTerrainProvider({
        //     url: 'http://data.mars3d.cn/terrain'
        // })
        // 加载本地地形
        viewer.terrainProvider = new Cesium.CesiumTerrainProvider({
            url: './DEM0'
        });

        viewer.terrainProvider.readyPromise
            .then(terrainProvider => {
                // 地形已加载完成，可以进行相关操作
                console.log('Terrain is now ready.');
            })
            // .otherwise(err => {
            //     // 地形加载失败，处理错误
            //     console.error('Terrain error: ' + error);
            // })



        const options = {
            enableCompass: true,
            enableZoomControls: true, // 是否启用缩放控件
        }
        // 自定义指南针图的svg，可以去阿里图库下载
        // options.compassOuterRingSvg = ''
        new CesiumNavigation(viewer, options)
    </script>
</body>

</html>
