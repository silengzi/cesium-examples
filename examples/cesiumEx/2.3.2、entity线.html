<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./../../libs/cesium/Cesium1.98/Widgets/widgets.css">
    <script type="text/javascript" src="./../../libs/cesium/Cesium1.98/Cesium.js"></script>
    <script src="./env.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">

        Cesium.Ion.defaultAccessToken = defaultAccessToken
        const viewer = new Cesium.Viewer('map', {});
        
        // 开启帧率
        viewer.scene.debugShowFramesPerSecond = true;

        // Cesium 地形
        viewer.terrainProvider = Cesium.createWorldTerrain({
            requestWaterMask: true,
            requestVertexNormals: true
        })
        // 深度监测
        viewer.scene.globe.depthTestAgainstTerrain = true


        // 贴地
        var line1 = viewer.entities.add({
            name: 'line1',
            polyline: {
                position: Cesium.Cartesian3.fromDegreesArray([-77, 35, -80, 35, -90, 45]),
                width: 3,
                material: Cesium.Color.RED,
                clampToGround: true // 贴地划线
            }
        })

        // 不贴地
        var line2 = viewer.entities.add({
            name: 'line2',
            polyline: {
                position: Cesium.Cartesian3.fromDegreesArray([-77, 30, -80, 30, -90, 40]),
                width: 3,
                material: Cesium.Color.BLUE,
                clampToGround: false
            }
        })

        // 不贴地2
        var start = Cesium.Cartesian3.fromDegrees(-57, 30, 2800.0)
        var end = Cesium.Cartesian3.fromDegrees(-70, 40, 300000.0)

        var line3 = viewer.entities.add({
            name: 'line3',
            polyline: {
                position: [start, end],
                width: 3,
                material: Cesium.Color.GREEN,
                clampToGround: false
            }
        })
    </script>
</body>

</html>
