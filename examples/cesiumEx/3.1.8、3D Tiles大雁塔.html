<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./../../libs/cesium/Cesium1.98/Widgets/widgets.css">
    <script type="text/javascript" src="./../../libs/cesium/Cesium1.98/Cesium.js"></script>
    <script src="./env.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">

        Cesium.Ion.defaultAccessToken = defaultAccessToken
        const viewer = new Cesium.Viewer('map', {});
        
        // 开启帧率
        viewer.scene.debugShowFramesPerSecond = true;

        const tileset = new Cesium.Cesium3DTileset({
            // url: './data/tileset.json'
            url: './3dtiles/dayanta/tileset.json'
        })
        tileset.readyPromise
            .then(tileset => {
                viewer.scene.primitives.add(tileset)
                viewer.zoomTo(tileset)

                changeHeight(tileset, -420); // 根据地形设置调整高度 大雁塔：-420
            }).catch(err => {
                console.log('err: ', err);
            })

        // 直接调用函数，调整高度,height表示物体离地面的高度
        function changeHeight(tileset, height) {
            height = Number(height);
            if (isNaN(height)) {
                return;
            }
            var cartographic = Cesium.Cartographic.fromCartesian(tileset.boundingSphere.center);
            var surface = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, cartographic.height);
            var offset = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, cartographic.height + height);
            var translation = Cesium.Cartesian3.subtract(offset, surface, new Cesium.Cartesian3());
            tileset.modelMatrix = Cesium.Matrix4.fromTranslation(translation);
        }

    </script>
</body>

</html>
