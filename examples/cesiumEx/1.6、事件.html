    <script type="text/javascript">

        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwNDljNWFmZC03MzRlLTRiMDMtYWIwMi00Yjk4YWQ4NzQwZGEiLCJpZCI6MjU5LCJpYXQiOjE3NTEzNzkyMzR9.OTqPNs3UGNnT1LYkPTavV80wN8Es_YphpJgQcpdnqWc'
        const viewer = new Cesium.Viewer('map', {});
        
        // 开启帧率
        viewer.scene.debugShowFramesPerSecond = true;

        // 0. 取消默认的单击（选中要素）和双击（定位到要素）事件，右上角弹窗很丑
        viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK)
        viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK)

        // https://blog.csdn.net/u010358183/article/details/121610901

        // 1、屏幕空间事件（鼠标和键盘输入相关的事件）
        //  鼠标事件
        //  键盘事件
        // 2、相机事件
        // 3、场景触发事件

        // 1、屏幕空间事件（鼠标和键盘输入相关的事件）
        // 左单击
        let handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas)
        handler.setInputAction((event) => {
            // event.position 是屏幕坐标（Screen Coordinates），即相对于canvas左上角的像素坐标，格式为{x:..., y:...}
            console.log('左键单击: ', event.position);
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK)
        handler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK)

        // shift + 左单机
        handler.setInputAction((event) => {
            console.log('shift + 左键单击', event.position);
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK, Cesium.KeyboardEventModifier.SHIFT)
        handler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK, Cesium.KeyboardEventModifier.SHIFT)


        // 2、--------------相机事件（更改默认操作）----------
        // 重新配置相机倾斜事件类型，自定义用户操作体验
        // 作用：让用户更精确地控制相机倾斜，避免误操作
        viewer.scene.screenSpaceCameraController.tiltEventTypes = [
            Cesium.CameraEventType.RIGHT_DRAG,        // 右键拖拽 - 直接倾斜相机
            Cesium.CameraEventType.PINCH,             // 触摸屏捏合手势 - 支持移动设备
            {
                eventType: Cesium.CameraEventType.LEFT_DRAG,    // 左键拖拽
                modifier: Cesium.KeyboardEventModifier.CTRL,    // 需要按住Ctrl键 - 防止误操作
            },
            {
                eventType: Cesium.CameraEventType.RIGHT_DRAG,   // 右键拖拽
                modifier: Cesium.KeyboardEventModifier.CTRL,    // 需要按住Ctrl键 - 提供额外控制选项
            },
        ];

        // 配置相机缩放事件类型，分离缩放和倾斜操作
        // 作用：让不同操作有明确的触发方式，提升用户体验
        viewer.scene.screenSpaceCameraController.zoomEventTypes = [
            Cesium.CameraEventType.MIDDLE_DRAG,       // 中键拖拽 - 专门用于缩放
            Cesium.CameraEventType.WHEEL,             // 鼠标滚轮 - 最常用的缩放方式
            Cesium.CameraEventType.PINCH,             // 触摸屏捏合手势 - 移动设备支持
        ];

        //----------- 3、场景触发事件(相机停止移动时触发，二三维联动)-------------------------
        // 定义相机移动结束后的回调函数
        // 作用：常用于二三维地图联动，在相机停止移动后更新其他视图
        function callbackFunc(event) {
            console.log(event)  // 输出相机移动结束事件信息
        }
        // 添加相机移动结束事件监听器
        viewer.camera.moveEnd.addEventListener(e => callbackFunc(e))
        // 如果需要移除事件监听器，可以使用下面的代码
        // viewer.camera.moveEnd.removeEventListener(callbackFunc)

        // 常见的应用

                    35.0,
                ]),
                material: Cesium.Color.RED.withAlpha(0.5)
            },
            data: {
                name: 'hello'
            }
        })
