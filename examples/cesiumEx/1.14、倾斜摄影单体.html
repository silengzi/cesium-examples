<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">

        Cesium.Ion.defaultAccessToken = defaultAccessToken
        const viewer = new Cesium.Viewer('map', {});
        
        // 开启帧率
        viewer.scene.debugShowFramesPerSecond = true;

        const tileset = new Cesium.Cesium3DTileset({
            url: './data/tileset.json'
        })
        tileset.readyPromise
            .then(tileset => {
                viewer.scene.primitives.add(tileset)
                viewer.zoomTo(tileset)
            }).catch(err => {
                console.log('err: ', err);
            })

        // 0、取消默认的单击和双击事件，右上角弹窗很丑

        viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK)

        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas)

        //     var cartesian3 = new Cesium.Cartesian3(position.x, position.y, position.z)

        //     var lat = Cesium.Math.toDegrees(cartographic.latitude);
        //     var lng = Cesium.Math.toDegrees(cartographic.longitude);

        //     // 获取被点击的实体
        //     var ray1 = viewer.camera.getPickRay(clickEvent.position);
        //     var cartesian = viewer.scene.globe.pick(ray1, viewer.scene);
        //     var pick = viewer.scene.pickPosition(clickEvent.position);
        //     var pickEd = viewer.scene.pick(clickEvent.position);
        //     if (pickEd && pick) {
        //         console.log(pickEd)
        //         var r = 255;
        //         var g = 255;
        //         var b = 255;
        //         var a = 0.99;
        //         tileset.style = new Cesium.Cesium3DTileStyle({ color: "color('rgba(" + r + "," + g + "," + b + ", " + a + ")')" })
        //     }
        // }, Cesium.ScreenSpaceEventType.LEFT_CLICK)

        /*鼠标移动选择开始*/
        // 创建一个蓝色轮廓的后处理阶段，用于边缘检测高亮
        var silhouetteBlue = Cesium.PostProcessStageLibrary.createEdgeDetectionStage() // 创建边缘检测后处理阶段
        silhouetteBlue.uniforms.color = Cesium.Color.BLUE // 设置轮廓颜色为蓝色
        silhouetteBlue.uniforms.length = 0.01 // 设置轮廓线宽度，数值越大线越粗
        silhouetteBlue.selected = [] // 初始化选中对象数组，后续可动态添加需要高亮的对象

        var silhouetteGreen = Cesium.PostProcessStageLibrary.createEdgeDetectionStage()
        silhouetteGreen.uniforms.color = Cesium.Color.LIME
        silhouetteGreen.uniforms.length = 0.01
        silhouetteGreen.selected = []

        viewer.scene.postProcessStages.add(Cesium.PostProcessStageLibrary.createSilhouetteStage([silhouetteBlue, silhouetteGreen]))

        //  movement.endPosition 与 movement.position 的区别：
        // 1) movement.endPosition：仅在鼠标移动类事件（MOUSE_MOVE）中提供，表示“当前这一帧鼠标移动结束时”的屏幕坐标（像素点）。
        //    适用于实时拾取/悬停高亮等连续跟随鼠标位置的逻辑。
        // 2) movement.position：仅在点击类事件（LEFT_CLICK/RIGHT_CLICK/LEFT_DOUBLE_CLICK 等）中提供，表示“触发点击事件的屏幕坐标”（按下/抬起时刻）。
        //    适用于点击选中、获取点击点位置/要素等一次性操作。
        // 简记：移动用 endPosition（连续更新），点击用 position（触发时刻）。
        viewer.screenSpaceEventHandler.setInputAction(movement => {
            var pickedFeature = viewer.scene.pick(movement.endPosition) // 此处在 MOUSE_MOVE 中使用 endPosition
            if(Cesium.defined(pickedFeature)) {
                if(pickedFeature == silhouetteGreen.selected[0]) {
                    silhouetteBlue.selected = []
                } else {
                    silhouetteBlue.selected = [pickedFeature]
                }
            }
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE)

        // 点击事件中使用 movement.position：表示点击发生时的屏幕坐标

        //         silhouetteGreen.selected = [pickedFeature]
        //     }

        /*鼠标移动选择结束*/
