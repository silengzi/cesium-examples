<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./../../libs/cesium/Cesium1.98/Widgets/widgets.css">
    <script type="text/javascript" src="./../../libs/cesium/Cesium1.98/Cesium.js"></script>
    <script src="./env.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">

        Cesium.Ion.defaultAccessToken = defaultAccessToken
        const viewer = new Cesium.Viewer('map', {});
        
        // 开启帧率
        viewer.scene.debugShowFramesPerSecond = true;

        // ImageryLayer
        // ImageryLayerCollection
        // ImageryProvider
        // ImageryProvider 子类        

        // https://cesium.com/learn/cesiumjs/ref-doc/ImageryLayer.html#.ConstructorOptions

        // 高级配置
        var imageryProvider = new Cesium.SingleTileImageryProvider({
            url: './world_b.jpg'
        })
        let options = {
            alpha: 1,        // 透明度值，范围0-1，1表示完全不透明，0表示完全透明
            hue: 0.3,        // 色调偏移值，范围0-1，用于调整影像的颜色色调
            saturation: 0.3, // 饱和度值，范围0-1，控制影像颜色的鲜艳程度，0为灰度图
            gamma: 0.3       // 伽马值，范围0-1，用于调整影像的亮度和对比度
        }
        var imageryLayer = new Cesium.ImageryLayer(imageryProvider, options)
        viewer.imageryLayers.add(imageryLayer)
        // imageryLayer.alpha = 0.5

        // 简单配置，只设置静态图片
        // var imageryProvider = new Cesium.SingleTileImageryProvider({
        //     url: './world_b.jpg',
        //     id: '1'
        // })
        // viewer.imageryLayers.addImageryProvider(imageryProvider)
    </script>
</body>

</html>
