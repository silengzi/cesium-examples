<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./../../libs/cesium/Cesium1.98/Widgets/widgets.css">
    <script type="text/javascript" src="./../../libs/cesium/Cesium1.98/Cesium.js"></script>
    <script src="./env.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <div id="map" style="margin: 0 auto; width: 100%; height: 50%"></div>
    <script type="text/javascript">

        Cesium.Ion.defaultAccessToken = defaultAccessToken
        const viewer = new Cesium.Viewer('map', {});

        const position = new Cesium.Cartesian3.fromDegrees(120, 30, 100000);
        // 给定飞行一周所需时间，比如10s, 那么每秒转动度数
        var angle = 360 / 10
        // 给定相机距离点多少距离飞行，这里取值为5000m
        var distance = 5000000
        var heading = Cesium.Math.toRadians(0);
        var pitch = Cesium.Math.toRadians(-30);
        
        var startTime = new Cesium.JulianDate.fromDate(new Date())
        var stopTime = new Cesium.JulianDate.addSeconds(startTime, 10, new Cesium.JulianDate())

        viewer.clock.startTime = startTime.clone() // 开始时间
        viewer.clock.stopTime = stopTime.clone() // 结束时间
        viewer.clock.currentTime = startTime.clone() // 当前时间
        
    </script>
</body>

</html>
