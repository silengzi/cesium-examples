<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./../../libs/cesium/Cesium1.98/Widgets/widgets.css">
    <script type="text/javascript" src="./../../libs/cesium/Cesium1.98/Cesium.js"></script>
    <script src="./env.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #fff; width: 100%; height: 100%; position: absolute; top: 0">
    <button onclick="addEntity()">添加自动计算贴地，需要等到地形加载完，且在大范围下</button>
    <div id="map" style="margin: 0 auto; width: 100%; height: 100%"></div>
    <script type="text/javascript">

        Cesium.Ion.defaultAccessToken = defaultAccessToken
        const viewer = new Cesium.Viewer('map', {});
        
        // 开启帧率
        viewer.scene.debugShowFramesPerSecond = true;

        // Cesium 地形
        viewer.terrainProvider = Cesium.createWorldTerrain({
            requestWaterMask: true,
            requestVertexNormals: true
        })

        // 深度监测
        viewer.scene.globe.depthTestAgainstTerrain = true

        // http://cesium.xin/cesium/cn/Documentation1.72/LabelGraphics.html#.ConstructorOptions

        var helloEntity = viewer.entities.add({
            name: '贴地',
            position: Cesium.Cartesian3.fromDegrees(-75.166493, 39.9060534),
            point: {
                pixelSize: 5,
                color: Cesium.Color.RED,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2,
                verticalOrigin: Cesium.VerticalOrigin.TOP,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                // disableDepthTestDistance: 0
            },
            label: {
                text: '贴地',
                font: '14px monospace',
                outlineWidth: 2,
                verticalOrigin: Cesium.VerticalOrigin.TOP,
                heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                showBackground: true,
                backgroundColor: Cesium.Color.WHITE
            }
        })

        var worldEntity = viewer.entities.add({
            name: '不贴地',
            position: Cesium.Cartesian3.fromDegrees(-95.166493, 39.9060534, 2000),
            point: {
                pixelSize: 5,
                color: Cesium.Color.RED,
                outlineColor: Cesium.Color.WHITE,
                outlineWidth: 2
            },
            label: {
                text: '不贴地',
                font: '14px monospace',
                outlineWidth: 2
            }
        })

        // 自动计算贴地，需要等地形加载完方可
        function addEntity() {
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(-115.166493, 39.9060534, 15000.0),
                duration: 3,
                orientation: {
                    heading: Cesium.Math.toRadians(90.0),
                    pitch: Cesium.Math.toRadians(-90.0),
                    roll: 0.0
                },
                complete: () => {
                    setTimeout(() => {
                        var cartographic = Cesium.Cartographic.fromDegrees(-115.166493, 39.9060534)
                        var height = viewer.scene.globe.getHeight(cartographic)
                        console.log('height: ', height)

                        var haha = viewer.entities.add({
                            name: '自动计算贴地',
                            position: Cesium.Cartesian3.fromDegrees(-115.166493, 39.9060534, height + 0.1),
                            point: {
                                pixelSize: 5,
                                color: Cesium.Color.RED,
                                outlineColor: Cesium.Color.WHITE,
                                outlineWidth: 2,
                                verticalOrigin: Cesium.VerticalOrigin.TOP,
                                disableDepthTestDistance: NUMBER.POSITIVE_INFINITY
                            },
                            label: {
                                text: '自动计算贴地',
                                font: '14pt monospace',
                                outlineWidth: 2,
                                verticalOrigin: Cesium.VerticalOrigin.TOP,
                                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                            }
                        })
                    }, 1000)
                }
            })
        }
    </script>
</body>

</html>
